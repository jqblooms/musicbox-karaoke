<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>musicbox karaoke</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- the lock: the songs are encrypted; the password unlocks them here, in the browser -->
  <section id="lock" class="lock">
    <div class="lock-card">
      <img src="icon.png" alt="" class="lock-icon">
      <h1>musicbox karaoke</h1>
      <form id="lockForm" autocomplete="off">
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
        <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
        <button class="btn blue" type="submit">Unlock</button>
      </form>
      <p id="lockMsg" class="lock-msg"></p>
    </div>
  </section>

  <section id="app" class="app" hidden>
    <header class="nav">
      <span class="nav-title">musicbox</span>
      <div class="search">
        <input id="q" type="search" placeholder="Search karaoke songs" autocomplete="off" spellcheck="false">
        <div id="results" class="results" hidden></div>
      </div>
    </header>

    <main class="main">
      <div id="stageCol" class="stage-col">
        <div id="stage" class="stage">
          <div id="ytHost" class="yt"><div id="yt"></div></div>
          <canvas id="lyrics" class="lyrics"></canvas>
          <!-- covers YouTube's player so its own hover and pause layers never show; clicks are ours -->
          <div id="cover" class="cover"></div>
          <div id="pauseScreen" class="pause" hidden><div class="pause-card"><div class="pause-sign"><i></i><i></i></div><b>Paused</b><span>Click or press Space to carry on</span></div></div>
          <div id="mapHit" class="map-hit" title="Jump to here"></div>
          <div id="welcome" class="welcome">
            <h2>Pick a song to sing</h2>
            <p>Search above, or start with one of these:</p>
            <div id="picks" class="picks"></div>
          </div>
          <div id="toast" class="toast" hidden></div>
          <div id="adPill" class="ad-pill" hidden>Ad - click YouTube's <b>Skip</b> button</div>
          <!-- full screen: a mini bar that comes up when the mouse moves -->
          <div id="fsBar" class="fsbar">
            <button id="fsPlay" class="btn round" title="Play / pause (Space)">&#9654;</button>
            <button id="fsNext" class="btn round" title="Next song (N)">&#9197;</button>
            <div class="now"><b id="fsTitle"></b><span id="fsArtist"></span></div>
            <button id="fsSkipAd" class="btn small" title="Lets you click YouTube's Skip button">Skip ad</button>
            <button id="fsMute" class="btn round" title="Mute (M)">&#128266;</button>
            <input id="fsVol" class="vol" type="range" min="0" max="100" step="1" title="Volume (Up / Down)">
            <button id="fsExit" class="btn small blue" title="Exit full screen (Esc)">Exit full screen</button>
          </div>
        </div>
        <div class="controls">
          <button id="playBtn" class="btn round" title="Play / pause (Space)">&#9654;</button>
          <button id="nextBtn" class="btn round" title="Next song (N)">&#9197;</button>
          <div class="now"><b id="nowTitle">Nothing playing</b><span id="nowArtist"></span></div>
          <button id="muteBtn" class="btn round" title="Mute (M)">&#128266;</button>
          <input id="vol" class="vol" type="range" min="0" max="100" step="1" title="Volume (Up / Down)">
          <label class="switch-row" title="Note bars"><span>Notes</span><input id="notesSw" type="checkbox" class="switch"></label>
          <button id="skipAdBtn" class="btn small" title="Lets you click YouTube's Skip button">Skip ad</button>
          <button id="fsBtn" class="btn round" title="Full screen (F)">&#x26F6;</button>
        </div>
      </div>
      <aside class="side">
        <div class="side-bar"><b>Up next</b><button id="shuffleBtn" class="btn small" title="New suggestions">New picks</button></div>
        <div id="upnext" class="list"></div>
      </aside>
    </main>
  </section>

  <script src="chart.js"></script>
  <script src="draw.js"></script>
  <script src="recommend.js"></script>
  <script src="app.js"></script>
</body>
</html>
